apiVersion: apps/v1
kind: Deployment
metadata:
  name: terex-be
  namespace: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: terex-be
  template:
    metadata:
      labels:
        app: terex-be
    spec:
      containers:
        - name: terex-be
          image: registry.legendary-trio.me/lt-inc/terex-be:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: terex-be-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: terex-secret
                  key: DATABASE_URL
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-secret
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-secret
                  key: S3_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
