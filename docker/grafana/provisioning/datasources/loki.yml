apiVersion: 1

datasources:
  - name: Loki
    uid: loki-ds
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      derivedFields:
        # formatted panels (| logfmt): trace_id is a parsed label, not part of the shown line
        - name: Trace
          matcherType: label
          matcherRegex: trace_id
          url: '$${__value.raw}'
          datasourceUid: tempo-ds
          urlDisplayLabel: Open trace
        # raw panels (Full logs): trace_id=<32 hex> inside the line (text or JSON logs)
        - name: Trace (line)
          matcherRegex: 'trace_id["=:]+"?([0-9a-f]{32})'
          url: '$${__value.raw}'
          datasourceUid: tempo-ds
          urlDisplayLabel: Open trace
