apiVersion: apps/v1
kind: Deployment
metadata:
  name: terex-twitch-collector
  namespace: admin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: terex-twitch-collector
  template:
    metadata:
      labels:
        app: terex-twitch-collector
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: terex-twitch-collector
          # The workflow renders this placeholder to its immutable commit tag.
          image: registry.legendary-trio.me/lt-inc/terex-twitch-collector:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: terex-twitch-collector
                  key: DATABASE_URL
            - name: TWITCH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: terex-twitch-collector
                  key: TWITCH_CLIENT_ID
            - name: TWITCH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: terex-twitch-collector
                  key: TWITCH_CLIENT_SECRET
            - name: TEREX_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: terex-service-tokens
                  key: TEREX_SERVICE_TOKEN
            - name: COLLECTOR_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: terex-service-tokens
                  key: COLLECTOR_SERVICE_TOKEN
            - name: TEREX_URL
              value: http://terex-be:8000
            - name: HTTP_ADDR
              value: ":8080"
            - name: TMP_DIR
              value: /tmp/twitch-collector
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "1"
              memory: 768Mi
              ephemeral-storage: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 700Mi
---
apiVersion: v1
kind: Service
metadata:
  name: terex-twitch-collector
  namespace: admin
spec:
  type: ClusterIP
  selector:
    app: terex-twitch-collector
  ports:
    - name: http
      port: 8080
      targetPort: http
