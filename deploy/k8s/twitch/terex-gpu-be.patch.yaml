spec:
  template:
    spec:
      containers:
        - name: terex-gpu-be
          env:
            - name: MAIN_COORDINATOR_ADDR
              valueFrom: null
              value: terex-be:9091
            - name: RABBITMQ_URL
              value: null
              valueFrom:
                secretKeyRef:
                  name: terex-runtime
                  key: RABBITMQ_URL
