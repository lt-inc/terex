# Twitch-only pilot: docker compose -f docker-compose.yml -f docker-compose.twitch.yml up --build
services:
  main-be:
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      TEREX_SERVICE_TOKEN: ${TEREX_SERVICE_TOKEN:?Set a random TEREX_SERVICE_TOKEN}
      COLLECTOR_SERVICE_TOKEN: ${COLLECTOR_SERVICE_TOKEN:?Set a distinct random COLLECTOR_SERVICE_TOKEN}
      TWITCH_CLEANUP_ENABLED: ${TWITCH_CLEANUP_ENABLED:-false}
      TWITCH_CLEANUP_INTERVAL: ${TWITCH_CLEANUP_INTERVAL:-1h}
      TWITCH_STORAGE_PROMETHEUS_URL: ${TWITCH_STORAGE_PROMETHEUS_URL:-}
      TWITCH_STORAGE_MIN_FREE_BYTES: ${TWITCH_STORAGE_MIN_FREE_BYTES:-1073741824}
      TWITCH_STORAGE_MIN_FREE_PERCENT: ${TWITCH_STORAGE_MIN_FREE_PERCENT:-10}
  fe:
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
  gpu-be:
    build:
      context: .
      dockerfile: ${GPU_DOCKERFILE:-gpu-be/Dockerfile}
  collector-db-init:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGDATABASE: main
      PGUSER: postgres
      PGPASSWORD: postgres
      COLLECTOR_DB_PASSWORD: ${COLLECTOR_DB_PASSWORD:?Set a random COLLECTOR_DB_PASSWORD}
    volumes:
      - ./docker/collector-db-init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  twitch-collector:
    build:
      context: .
      dockerfile: twitch-collector/Dockerfile
    environment:
      DATABASE_URL: postgres://twitch_collector:${COLLECTOR_DB_PASSWORD:?Set COLLECTOR_DB_PASSWORD}@postgres:5432/main?sslmode=disable
      TEREX_URL: http://main-be:8000
      TEREX_SERVICE_TOKEN: ${TEREX_SERVICE_TOKEN:?Set TEREX_SERVICE_TOKEN}
      COLLECTOR_SERVICE_TOKEN: ${COLLECTOR_SERVICE_TOKEN:?Set COLLECTOR_SERVICE_TOKEN}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      HTTP_ADDR: ":8080"
      TMP_DIR: /tmp/twitch-collector
      OTEL_SERVICE_NAME: terex-twitch-collector
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=700m
    mem_limit: 768m
    cpus: 1.0
    restart: unless-stopped
    depends_on:
      collector-db-init: {condition: service_completed_successfully}
      main-be: {condition: service_started}
      gpu-be: {condition: service_started}
      tempo: {condition: service_started}
