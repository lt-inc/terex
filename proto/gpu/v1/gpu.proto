syntax = "proto3";

package gpu.v1;

option go_package = "terex/proto/gpu/v1;gpuv1";

import "google/protobuf/timestamp.proto";

// GpuService is implemented by gpu-be and called by main-be over the internal network.
service GpuService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc GetJobStatus(GetJobStatusRequest) returns (GetJobStatusResponse);
  rpc ListClips(ListClipsRequest) returns (ListClipsResponse);

  // Storage gateway: main-be never touches MinIO directly.
  rpc PresignGet(PresignGetRequest) returns (PresignResponse);
  rpc PresignPut(PresignPutRequest) returns (PresignResponse);
  rpc PutAuthFile(PutAuthFileRequest) returns (ObjectRef);
  rpc DeleteObject(ObjectRef) returns (DeleteObjectResponse);
}

message HealthRequest {}
message HealthResponse { bool ok = 1; }

message ObjectRef {
  string bucket = 1;
  string object = 2;
}

message GetJobStatusRequest { string job_id = 1; }
message GetJobStatusResponse {
  string job_id = 1;
  string stage = 2;      // preproc | candidate | renderer
  string status = 3;     // queued | running | done | failed
  string fail_place = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message Clip {
  string clip_id = 1;
  string job_id = 2;
  ObjectRef object = 3;
  double start_sec = 4;
  double end_sec = 5;
  string title = 6;
  repeated string hashtags = 7;
}
message ListClipsRequest { string job_id = 1; }
message ListClipsResponse { repeated Clip clips = 1; }

message PresignGetRequest {
  ObjectRef object = 1;
  int32 ttl_seconds = 2;
}

enum AssetKind {
  ASSET_KIND_UNSPECIFIED = 0;
  ASSET_KIND_BANNER = 1;
  ASSET_KIND_BACKGROUND = 2;
}
message PresignPutRequest {
  AssetKind kind = 1;
  string file_name = 2;
  int32 ttl_seconds = 3;
}
message PresignResponse {
  string url = 1;
  ObjectRef object = 2;
}

message PutAuthFileRequest {
  string platform = 1;
  string account_name = 2;
  bytes content = 3;
}
message DeleteObjectResponse {}
