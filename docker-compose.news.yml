# News collector pilot: docker compose -f docker-compose.yml -f docker-compose.news.yml up --build
# Needs OPENROUTER_API_KEY (embeddings + post generation), NEWS_SERVICE_TOKEN and NEWS_SECRET_KEY
# (`openssl rand -base64 32`, encrypts Telegram bot tokens stored in the database).
# Panel: http://localhost:3000/admin/news
services:
  main-be:
    environment:
      NEWS_COLLECTOR_URL: http://news-collector:8080
      NEWS_SERVICE_TOKEN: ${NEWS_SERVICE_TOKEN:?Set a random NEWS_SERVICE_TOKEN}
  news-collector:
    build:
      context: .
      dockerfile: news-collector/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/main?sslmode=disable
      NEWS_SERVICE_TOKEN: ${NEWS_SERVICE_TOKEN:?Set a random NEWS_SERVICE_TOKEN}
      NEWS_SECRET_KEY: ${NEWS_SECRET_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}   # optional: stock photos for posts (free key: pixabay.com/api/docs)
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}     # optional alternative provider (pexels.com/api)
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4.1-flash}
      NEWS_EMBEDDING_MODEL: ${NEWS_EMBEDDING_MODEL:-openai/text-embedding-3-small}
      HTTP_ADDR: ":8080"
      OTEL_SERVICE_NAME: terex-news-collector
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    mem_limit: 384m
    cpus: 0.5
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      tempo: {condition: service_started}
