name: Workflow tests
on:
  pull_request:
  push:
    branches: [master, 'codex/**']
jobs:
  backend:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: workflow_test
          POSTGRES_DB: workflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready
          --health-interval 5s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-management
        ports: ['5672:5672']
    env:
      TEST_DATABASE_URL: postgres://postgres:workflow_test@localhost:5432/workflow_test?sslmode=disable
      TEST_AMQP_URL: amqp://guest:guest@localhost:5672/
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: '**/go.sum'
      - run: go test ./proto/... ./main-be/... ./gpu-be/...
      - name: Media smoke with runtime media packages
        run: |
          go test -c -o /tmp/media-smoke ./gpu-be/internal/repository/ffmpeg
          docker build -f docker/Dockerfile.media-smoke -t terex-media-smoke:ci .
          docker run --rm -e MEDIA_SMOKE=1 -v /tmp/media-smoke:/smoke/test:ro terex-media-smoke:ci /smoke/test -test.run TestMediaSmoke -test.v
  frontend:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: FE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
