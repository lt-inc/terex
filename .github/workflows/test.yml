name: Workflow tests
on:
  pull_request:
  push:
    branches: [master, 'codex/**']
jobs:
  backend:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: workflow_test
          POSTGRES_DB: workflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready
          --health-interval 5s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-management
        ports: ['5672:5672']
    env:
      TEST_DATABASE_URL: postgres://postgres:workflow_test@localhost:5432/workflow_test?sslmode=disable
      COLLECTOR_TEST_DATABASE_URL: postgres://postgres:workflow_test@localhost:5432/workflow_test?sslmode=disable
      TEST_AMQP_URL: amqp://guest:guest@localhost:5672/
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: '**/go.sum'
      - name: Validate deployment workflow and Kubernetes resources
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          python3 scripts/render-twitch-deploy.py --image "registry.legendary-trio.me/lt-inc/terex-twitch-collector:${{ github.sha }}"
          go run github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0 -strict -summary -kubernetes-version 1.31.0 .twitch-deploy/collector.yaml .twitch-deploy/db-init-configmap.json deploy/k8s/twitch/db-init-job.yaml deploy/k8s/twitch/github-deployer-rbac.yaml deploy/k8s/twitch/gpu-service.yaml
          sh -n docker/collector-db-init.sh
      - run: go test ./proto/... ./main-be/... ./gpu-be/... ./twitch-collector/...
      - name: Verify real DB bootstrap, restricted login and repeated provisioning
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGDATABASE: workflow_test
          PGUSER: postgres
          PGPASSWORD: workflow_test
          COLLECTOR_DB_PASSWORD: workflow_collector_only
          COLLECTOR_DATABASE_URL: postgres://twitch_collector:workflow_collector_only@localhost:5432/workflow_test?sslmode=disable
        run: |
          docker run --rm --network host \
            -e PGHOST -e PGPORT -e PGDATABASE -e PGUSER -e PGPASSWORD \
            -e COLLECTOR_DB_PASSWORD -e COLLECTOR_DATABASE_URL \
            -v "$PWD/docker/collector-db-init.sh:/init.sh:ro" \
            postgres:16-alpine sh -c 'sh /init.sh && sh /init.sh'
      - name: Build pinned collector image
        run: docker build -f twitch-collector/Dockerfile -t terex-twitch-collector:ci .
      - name: Media smoke with runtime media packages
        run: |
          go test -c -o /tmp/media-smoke ./gpu-be/internal/repository/ffmpeg
          docker build -f docker/Dockerfile.media-smoke -t terex-media-smoke:ci .
          docker run --rm -e MEDIA_SMOKE=1 -v /tmp/media-smoke:/smoke/test:ro terex-media-smoke:ci /smoke/test -test.run 'Test.*MediaSmoke' -test.v
  frontend:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: FE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
